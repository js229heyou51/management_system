<div class="layui-step" id="layui-seo" >
	<form class="layui-form">
		<div class="layui-form-item">
			<label class="layui-form-label">{:lang('common')['pageTitle']??''}</label>
			<div class="layui-input-block">
				<textarea class="layui-textarea" id="ym_tit" name="ym_tit" placeholder="{:lang('common')['pageTitle']??''}">{$find.ym_tit??''}</textarea>
				<div class="layui-form-mid layui-word-aux">{:lang('common')['pageTitleTip']??''}</div>
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">{:lang('common')['pageKeyword']??''}</label>
			<div class="layui-input-block">
				<textarea class="layui-textarea" id="ym_key" name="ym_key" placeholder="{:lang('common')['pageKeyword']??''}">{$find.ym_key??''}</textarea>
				<div class="layui-form-mid layui-word-aux">{:lang('common')['pageKeywordTip']??''}</div>
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">{:lang('common')['pageDesc']??''}</label>
			<div class="layui-input-block">
				<textarea class="layui-textarea" id="ym_des" name="ym_des" placeholder="{:lang('common')['pageDesc']??''}">{$find.ym_des??''}</textarea>
				<div class="layui-form-mid layui-word-aux">{:lang('common')['pageDescTip']??''}</div>
			</div>
		</div>
	</form>
	
	<div class="layui-form-item" style="margin-top:10px;">
		<div class="layui-input-block">
			<button type="button" class="layui-btn layui-btn-primary layui-border" onclick="step('prev')">{:lang('common')['prevStep']??''}</button>
			<button type="button" class="layui-btn layui-bg-color" onclick="save()">{:lang('common')['save']??''}</button>
		</div>
	</div>
</div>
