<script type="text/html" id="state">
	{if(isset($conf.co.ding) && $conf.co.ding == true)}
	<input type="checkbox" name="ding" value="{{d.id}}" lay-skin="switch" lay-text="{:lang('common')['ding']??''}|{:lang('common')['ding']??''}" lay-filter="ding" {{# if(d.ding==1){ }} checked {{# } }}>
	{/if}
	{if(isset($conf.co.tuijian) && $conf.co.tuijian == true)}
	<input type="checkbox" name="tuijian" value="{{d.id}}" lay-skin="switch" lay-text="{:lang('common')['recommend']??''}|{:lang('common')['recommend']??''}" lay-filter="tuijian" {{# if(d.tuijian==1){ }} checked {{# } }}>
	{/if}
	{if(isset($conf.co.hot) && $conf.co.hot == true)}
	<input type="checkbox" name="tuijian" value="{{d.id}}" lay-skin="switch" lay-text="{:lang('common')['hot']??''}|{:lang('common')['hot']??''}" lay-filter="hot" {{# if(d.hot==1){ }} checked {{# } }}>
	{/if}
	{if(isset($conf.co.pass) && $conf.co.pass == true)}
	<input type="checkbox" name="pass" value="{{d.id}}" lay-skin="switch" lay-text="{:lang('common')['shield']??''}|{:lang('common')['unshielded']??''}" lay-filter="pass" {{# if(d.pass==0){ }} checked {{# } }}>
	{/if}
</script>
